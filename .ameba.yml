Lint/UselessAssign:
  Excluded:
    - spec/**/*.cr

Lint/NotNil:
  Excluded:
    - spec/**/*.cr

Style/MultilineStringLiteral:
  Excluded:
    - spec/**/*.cr

Metrics/CyclomaticComplexity:
  MaxComplexity: 25

Naming/BlockParameterName:
  MinNameLength: 1
  AllowNamesEndingInNumbers: true

# Public config flags use bare names (`config.verbose`, not `verbose?`).
Naming/QueryBoolMethods:
  Enabled: false
