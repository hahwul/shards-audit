name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: 84codes/crystal:latest-debian-13
    steps:
      - uses: actions/checkout@v4
      - run: shards install
      - run: crystal spec
      - run: crystal build src/run.cr -o shards-audit --release --no-debug
